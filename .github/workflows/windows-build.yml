name: Windows build
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-dev-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-x64:
    name: Windows x64 app and model bundle
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      FETCH_CACHE: ${{ github.workspace }}\.cache\fetch
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      PIP_DISABLE_PIP_VERSION_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - name: Initialize Visual Studio x64 SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Python for packaging the existing bridge
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: engines/diffsinger/requirements.txt
      - name: Cache pinned dependency downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCH_CACHE }}
          key: windows-2022-x64-dependencies-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: windows-2022-x64-dependencies-
      - name: Check native tools
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (Test-Path -LiteralPath $llvm) { $llvm | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append; $env:PATH = "$llvm;$env:PATH" }
          clang-cl --version
          cmake --version
          ninja --version
          if ($LASTEXITCODE) { throw 'Native build tools unavailable' }
      - name: Build from flattened repository root
        id: build
        run: '& ./tools/build-windows-cloud.ps1 -BuildDirectory build-windows -FetchDirectory $env:FETCH_CACHE -Jobs 2'
      - name: Package app without model weights
        id: app
        run: '& ./tools/package-windows-cloud.ps1 -ReleaseDirectory "${{ steps.build.outputs.releaseDir }}"'
      - name: Verify packaged executable and menu policy
        run: |
          $env:HACHI_TEST_SETTINGS_DIR = "$env:RUNNER_TEMP\hachi-ci-settings"
          $exe = '${{ steps.app.outputs.stage }}\HachiShifter Next.exe'
          foreach ($case in @('smoke-track-types','smoke-engine-view-capabilities')) {
            $out = Join-Path $env:RUNNER_TEMP $case
            New-Item -ItemType Directory -Force $out | Out-Null
            $process = Start-Process -FilePath $exe -ArgumentList @("--$case", $out) -PassThru -RedirectStandardOutput "$out\stdout.txt" -RedirectStandardError "$out\stderr.txt"
            if (-not $process.WaitForExit(180000)) { $process.Kill(); throw "$case timed out" }
            if ($process.ExitCode) { Get-Content "$out\stderr.txt"; throw "$case failed: $($process.ExitCode)" }
            Get-Content "$out\stdout.txt"
          }
      - name: Upload app-only package
        uses: actions/upload-artifact@v4
        with:
          name: HachiShifterNext-windows-x64-app
          path: |
            dist/HachiShifterNext-windows-x64-app.zip
            dist/HachiShifterNext-windows-x64-app.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Fetch checksum-pinned owner-approved models
        run: |
          $resource = Get-Content -LiteralPath .github/model-resources.json -Raw | ConvertFrom-Json
          if ($resource.sha256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Model archive must have a pinned SHA256' }
          $archive = "$env:RUNNER_TEMP\hachi-model-resources.zip"
          Invoke-WebRequest -Uri $resource.url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $resource.sha256.ToLowerInvariant()) { throw 'Model archive checksum mismatch' }
          "MODEL_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MODEL_ARCHIVE_SHA256=$($resource.sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package app with verified model resources
        run: '& ./tools/package-windows-cloud.ps1 -ReleaseDirectory "${{ steps.build.outputs.releaseDir }}" -WithModels -ModelArchive $env:MODEL_ARCHIVE -ModelArchiveSha256 $env:MODEL_ARCHIVE_SHA256'
      - name: Upload app and models package
        uses: actions/upload-artifact@v4
        with:
          name: HachiShifterNext-windows-x64-with-models
          path: |
            dist/HachiShifterNext-windows-x64-with-models.zip
            dist/HachiShifterNext-windows-x64-with-models.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            build-windows/*.map
            ${{ runner.temp }}/smoke-track-types/
            ${{ runner.temp }}/smoke-engine-view-capabilities/
          if-no-files-found: ignore
          retention-days: 14
